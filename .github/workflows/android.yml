name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject secrets into local.properties
        # POLLINATIONS_APP_KEY must be configured as a repository secret.
        # local.properties is gitignored, so the real key never enters the repo.
        run: |
          echo "POLLINATIONS_APP_KEY=${{ secrets.POLLINATIONS_APP_KEY }}" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kynex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
